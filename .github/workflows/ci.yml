name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Shell syntax check
        run: bash -n install.sh scripts/smoke-test completions/bash/waystone && zsh -n completions/zsh/_waystone
      - name: Smoke test
        run: scripts/smoke-test
